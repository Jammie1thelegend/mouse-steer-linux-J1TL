[package]
name = "mouse-steer-linux-J1TL"
version = "0.1.0"
edition = "2021"

[dependencies]
evdev = "0.13.2"
thiserror = "1.0"
log = "0.4.22"
nix = "0.29.0"
env_logger = "0.10"
serde = { version = "1.0.216", features = ["derive"] }
toml = "0.8.19"
dirs = "5.0.1"
wayland-client = "0.31.14"
wayland-protocols = "0.32.12"
tempfile = "3.27.0"
wayland-server = "0.31.13"
smithay = "0.7.0"

[package.metadata]
os = "linux"

# used to panic! the entire program from a thread
[profile.release]
panic = 'abort'

[profile.dev]
panic = 'abort'
